server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/raizesdb;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "troque-por-uma-chave-grande-e-segura-com-32-caracteres-no-minimo"
  expiration: 86400000